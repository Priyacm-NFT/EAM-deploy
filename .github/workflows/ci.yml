name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eam
          POSTGRES_PASSWORD: eam
          POSTGRES_DB: eam
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        continue-on-error: true
      - run: pnpm install

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          DATABASE_URL: postgresql://eam:eam@localhost:5432/eam
          REDIS_URL: redis://localhost:6379
          JWT_PRIVATE_KEY: ${{ secrets.CI_JWT_PRIVATE_KEY || '' }}
          JWT_PUBLIC_KEY: ${{ secrets.CI_JWT_PUBLIC_KEY || '' }}
          MFA_ENCRYPTION_KEY: '00000000000000000000000000000000'
          INTEGRATION_SECRET_KEY: '00000000000000000000000000000000'

      - run: pnpm audit --audit-level=high
        continue-on-error: true

  load-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Run k6 load test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: load-tests/phase0-baseline.js
